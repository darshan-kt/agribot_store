# Mosquitto for the Agri Robot App Store.
#
# Two listeners:
#   1883  plaintext, bound to the compose network only, never published to the host.
#         Used by services that already sit inside the trust boundary.
#   8883  TLS, published to the host. This is how a real robot connects.
#
# Anonymous access is off everywhere. Every client authenticates with its own
# credentials and is confined to its own topic tree by acl_file.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

max_queued_messages 1000
max_inflight_messages 40

listener 1883 0.0.0.0

listener 8883 0.0.0.0
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false
